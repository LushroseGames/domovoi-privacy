<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domovoi — документы</title>
  <style>
    :root { --bg:#f7f1e7; --panel:#fffdf8; --ink:#2f2a26; --muted:#7a7168; --line:#e4d9c8; --teal:#2fa98c; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    main { width:min(760px,100%); background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:40px; box-shadow:0 20px 60px rgba(47,42,38,.12); }
    .logo { width:56px; height:56px; border-radius:18px; background:linear-gradient(135deg,#2fa98c,#7b5ea7); display:grid; place-items:center; color:#fff; font-size:26px; margin-bottom:18px; }
    h1 { font-size:28px; margin:0 0 8px; }
    p { color:var(--muted); line-height:1.6; margin:0 0 18px; }
    .links { display:grid; gap:10px; margin-top:24px; }
    a.card { display:block; padding:16px 18px; border:1px solid var(--line); border-radius:14px; color:var(--ink); text-decoration:none; font-weight:600; background:#fbf4e8; }
    a.card span { display:block; color:var(--muted); font-weight:400; font-size:14px; margin-top:4px; }
    a.card:hover { border-color:var(--teal); }
    footer { margin-top:24px; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="logo">⌂</div>
    <h1>Domovoi</h1>
    <p>Документы приложения для геймификации жизни. Здесь описано, какие данные использует приложение и на каких условиях.</p>
    <div class="links">
      <a class="card" href="privacy.html">Политика конфиденциальности<span>Какие данные, зачем, где хранятся и как удалить.</span></a>
      <a class="card" href="terms.html">Условия использования<span>Правила использования приложения.</span></a>
    </div>
    <footer>Контакт: domovoi.app@gmail.com</footer>
  </main>
</body>
</html>
